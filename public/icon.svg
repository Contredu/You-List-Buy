<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Icon House & Cart Motif -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(40, 40)">
    <!-- Shopping Cart Container -->
    <path d="M70 110 h50 l45 180 h170 l40 -130 h-235" />
    <circle cx="180" cy="340" r="22" fill="#ffffff" />
    <circle cx="310" cy="340" r="22" fill="#ffffff" />
    
    <!-- Home Roof above cart -->
    <path d="M190 70 L256 20 L322 70" stroke="#a7f3d0" stroke-width="26" />
    <path d="M220 70 v50 h72 v-50" stroke="#a7f3d0" stroke-width="20" fill="rgba(167, 243, 208, 0.2)" />
    
    <!-- Checkmark Badge -->
    <circle cx="330" cy="180" r="45" fill="#10b981" stroke="#ffffff" stroke-width="12" />
    <path d="M312 180 l12 12 l24 -24" stroke="#ffffff" stroke-width="14" />
  </g>
</svg>
